<style>

  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
         padding:18px 24px}
  h1{margin:0;font-size:20px;letter-spacing:-.02em}
  .sub{margin-top:4px;color:var(--muted);font-size:13px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
  button{font:inherit;font-size:13px;padding:7px 13px;border:1px solid var(--line);background:#fff;
         color:var(--ink);border-radius:7px;cursor:pointer}
  button:hover{border-color:#cbd5e1;background:#f8fafc}
  button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .count{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  main{padding:24px}
  h2{font-size:15px;margin:32px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);
     letter-spacing:-.01em}
  h2 span{color:var(--muted);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
  figure{margin:0}
  .frame{background:#fff;border:1px solid var(--line);border-radius:9px;aspect-ratio:1;
         display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
  .frame img{max-width:100%;max-height:100%;display:block}
  figcaption{margin-top:7px;font-size:11.5px;color:var(--muted);word-break:break-word;line-height:1.35}
  .tag{display:inline-block;margin-bottom:4px;font-size:10px;font-weight:700;letter-spacing:.04em;
       text-transform:uppercase;padding:2px 6px;border-radius:4px;background:#f1f5f9;color:var(--wait)}
  .is-white .tag{background:#ecfdf5;color:var(--ok)}
  .is-other .tag{background:#fffbeb;color:var(--no)}
  .hide{display:none}
  .note{margin:28px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:9px;
        color:var(--muted);font-size:12.5px}
  @media print{
    header{position:static} .bar{display:none} .hide{display:none!important}
    .grid{grid-template-columns:repeat(4,1fr);gap:10px} h2{break-after:avoid}
    figure{break-inside:avoid}
  }
</style>

  main.appendChild(h2);
  const grid = document.createElement('div');
  grid.className = 'grid'; grid.dataset.group = g.handle;
  for (const im of g.images) {
    const fig = document.createElement('figure');
    fig.dataset.url = im.url;
    fig.dataset.state = 'pending';
    fig.innerHTML =
      '<div class="frame"><img crossorigin="anonymous" src="' + im.url + '&width=500" alt=""></div>' +
      '<figcaption><span class="tag">analyse…</span><br>' +
      (im.alt ? im.alt.replace(/[<>&]/g, '') + '<br>' : '') +
      im.fichier + ' · ' + im.largeur + 'px</figcaption>';
    grid.appendChild(fig);
    classify(fig, fig.querySelector('img'), im);
  }
  main.appendChild(grid);
}

const note = document.createElement('p');
note.className = 'note';
note.textContent = "Le fond est mesuré dans le navigateur : chaque image est lue sur un canvas et " +
  "les pixels du pourtour sont échantillonnés. Si le CDN refuse la lecture cross-origin, le " +
  "classement retombe sur la convention de nommage Shopify (_pack_ = packshot, _life_ = lifestyle), " +
  "signalée par « ~ ». L’aperçu utilise le rendu 500px du CDN ; « Copier les URLs » " +
  "renvoie toujours les originaux pleine résolution. Impression : Ctrl/Cmd+P donne une planche-contact PDF.";
main.appendChild(note);

function classify(fig, img, im) {
  const done = (state, label) => {
    fig.dataset.state = state;
    fig.classList.toggle('is-white', state === 'white');
    fig.classList.toggle('is-other', state === 'other');
    fig.querySelector('.tag').textContent = label;
    apply();
  };
  img.addEventListener('error', () => done('other', 'image indisponible'));
  img.addEventListener('load', () => {
    try {
      const S = 80, c = document.createElement('canvas');
      c.width = S; c.height = S;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, S, S);
      const d = ctx.getImageData(0, 0, S, S).data;
      let white = 0, total = 0;
      const at = (x, y) => { const i = (y * S + x) * 4; return [d[i], d[i+1], d[i+2], d[i+3]]; };
      const ring = [];
      for (let x = 0; x < S; x++) { ring.push([x, 0], [x, S-1]); }
      for (let y = 1; y < S-1; y++) { ring.push([0, y], [S-1, y]); }
      for (const [x, y] of ring) {
        const [r, g, b, a] = at(x, y);
        total++;
        if (a < 12) { white++; continue; }              // transparent = blanc une fois posé
        const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
        if (mn >= 243 && mx - mn <= 12) white++;
      }
      const pct = Math.round(100 * white / total);
      done(pct >= 92 ? 'white' : 'other', 'fond ' + (pct >= 92 ? 'blanc' : 'non blanc') + ' · ' + pct + '%');
    } catch (e) {
      const g = im.indice;                              // canvas bloqué -> nommage
      if (g === 'packshot') done('white', '~ packshot');
      else if (g === 'lifestyle') done('other', '~ lifestyle');
      else done('unknown', '~ indéterminé');
    }
  });
  if (img.complete && img.naturalWidth) img.dispatchEvent(new Event('load'));
}

function visible(fig) {
  const s = fig.dataset.state;
  if (mode === 'all') return true;
  if (mode === 'white') return s === 'white' || s === 'pending' || s === 'unknown';
  return s === 'other' || s === 'unknown';
}

function apply() {
  let shown = 0, pending = 0;
  for (const fig of document.querySelectorAll('figure')) {
    if (fig.dataset.state === 'pending') pending++;
    const v = visible(fig);
    fig.classList.toggle('hide', !v);
    if (v && fig.dataset.state !== 'pending') shown++;
  }
  for (const grid of document.querySelectorAll('.grid')) {
    const any = [...grid.children].some(f => !f.classList.contains('hide'));
    grid.classList.toggle('hide', !any);
    grid.previousElementSibling.classList.toggle('hide', !any);
  }
  document.getElementById('count').textContent =
    shown + ' affichés' + (pending ? ' · ' + pending + ' en cours d\u2019analyse' : ' · analyse terminée');
}

function urls() {
  return [...document.querySelectorAll('figure')]
    .filter(f => !f.classList.contains('hide')).map(f => f.dataset.url);
}

for (const [id, m] of [['f-white','white'], ['f-other','other'], ['f-all','all']]) {
  document.getElementById(id).addEventListener('click', () => {
    mode = m;
    for (const o of ['f-white','f-other','f-all'])
      document.getElementById(o).setAttribute('aria-pressed', String(o === id));
    apply();
  });
}
document.getElementById('copy').addEventListener('click', async (e) => {
  await navigator.clipboard.writeText(urls().join('\n'));
  e.target.textContent = urls().length + ' URLs copiées';
  setTimeout(() => e.target.textContent = 'Copier les URLs affichées', 1800);
});
document.getElementById('dl').addEventListener('click', () => {
  const b = new Blob([urls().join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'cloud-walk-fond-blanc.txt';
  a.click();
});
apply();
</script>
</body>
</html>
